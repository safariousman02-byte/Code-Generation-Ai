<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neutraX · Spatial AI Agent Studio</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
    />
  </head>
  <body>
    <!-- Overlay to dim the background when drawer is open -->
    <div class="overlay" id="overlay"></div>

    <!-- ══════════════════════════════════════════════
       RECENTS & SETTINGS DRAWER
       ══════════════════════════════════════════════ -->
    <aside class="drawer" id="drawer">
      <div class="drawer-header">
        <h2>Recents & Settings</h2>
        <button class="icon-btn" id="closeDrawer">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="drawer-content">
        <span class="label">Recent Sessions</span>
        <ul class="recent-list">
          <li>
            <div class="recent-icon active">
              <span class="material-symbols-rounded">memory</span>
            </div>
            <div class="recent-info">
              <strong>#04 Autonomous Spatial Designer</strong>
              <span>1,420 tk · 4 artifacts</span>
            </div>
          </li>
          <li>
            <div class="recent-icon">
              <span class="material-symbols-rounded">code</span>
            </div>
            <div class="recent-info">
              <strong>#03 3D WebGL Shader Matrix</strong>
              <span>890 tk · 2 artifacts</span>
            </div>
          </li>
        </ul>
        <span class="label" style="margin-top: 24px">Telemetry & Memory</span>
        <div class="settings-list">
          <label class="toggle-row">
            <span>Auto-save queries</span>
            <input type="checkbox" checked />
          </label>
          <label class="toggle-row">
            <span>Cache model state</span>
            <input type="checkbox" checked />
          </label>
        </div>
      </div>
    </aside>

    <!-- ══════════════════════════════════════════════
       MAIN APP CONTAINER
       ══════════════════════════════════════════════ -->
    <div class="app-container">
      <!-- TOP NAVIGATION -->
      <header class="topbar">
        <!-- Left: Drawer Toggle -->
        <button class="icon-btn menu-btn" id="openDrawer">
          <span class="material-symbols-rounded">history</span>
        </button>

        <!-- Center/Left: Brand -->
        <div class="brand">
          <div class="brand-logo">
            <span class="material-symbols-rounded">blur_on</span>
          </div>
          <span class="brand-name">neutra<span class="accent">X</span></span>
        </div>

        <!-- Right: Actions -->
        <div class="topbar-actions">
          <button class="btn btn-primary">
            <span class="material-symbols-rounded" style="font-size: 16px"
              >add</span
            >
            New
          </button>
          <button class="btn btn-secondary avatar-btn">
            <span class="material-symbols-rounded">person</span>
          </button>
        </div>
      </header>

      <!-- CENTERED WORKSPACE -->
      <main class="workspace">
        <!-- Greeting -->
        <div class="greeting">
          <div class="greeting-icon">
            <span class="material-symbols-rounded">psychology</span>
          </div>
          <h1>Hi (user name), how can i<br />help you today!</h1>
        </div>

        <!-- Chat History Area (Hidden initially) -->
        <div class="chat-history" id="chatHistory"></div>

        <!-- PROMPT DOCK -->
        <div class="prompt-dock">
          <!-- Text Area -->
          <textarea
            id="userInput"
            placeholder="Ask neutraX anything or describe an autonomous workflow..."
            rows="2"
          ></textarea>

          <!-- Action Row -->
          <div class="prompt-actions">
            <!-- Left Icons -->
            <div class="actions-left">
              <button class="icon-btn small">
                <span class="material-symbols-rounded">add</span>
              </button>
              <button class="icon-btn small">
                <span class="material-symbols-rounded">attachment</span>
              </button>
              <button class="model-pill">
                <span class="material-symbols-rounded" style="font-size: 14px"
                  >network_node</span
                >
                Neural Core v4.2
              </button>
            </div>

            <!-- Right Icons -->
            <div class="actions-right">
              <button class="icon-btn small">
                <span class="material-symbols-rounded">graphic_eq</span>
              </button>
              <button class="send-btn" id="sendBtn">
                <span class="material-symbols-rounded">arrow_upward</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
